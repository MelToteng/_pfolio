<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A screenshot walkthrough of Smart Basket, an Android shopping app by Melchizedek Toteng.">
  <title>Smart Basket screenshots | Melchizedek Toteng</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  <script src="screenshot-viewer.js" defer></script>
</head>
<body>
  <main class="wrap section gallery-page" aria-labelledby="gallery-title">
    <a class="text-link" href="index.html#smart-basket">← Back to portfolio</a>
    <h1 id="gallery-title">Smart Basket</h1>
    <p>See how the Android app handles shopping lists, basket totals, barcode scanning and currency selection. Select a screenshot to view it.</p>
    <div class="screenshot-gallery">
      <figure>
        <a href="assets/smart-basket/01-splash.png" aria-label="Open full-size screenshot of launch screen">
          <img src="assets/smart-basket/01-splash.png" width="1080" height="2400" loading="lazy" alt="Smart Basket logo on the green splash screen">
        </a>
        <figcaption>Launch screen</figcaption>
      </figure>
      <figure>
        <a href="assets/smart-basket/02-empty-to-buy.png" aria-label="Open full-size screenshot of empty shopping list">
          <img src="assets/smart-basket/02-empty-to-buy.png" width="1080" height="2400" loading="lazy" alt="The empty To buy tab prompts shoppers to scan a barcode or add an item">
        </a>
        <figcaption>Empty shopping list</figcaption>
      </figure>
      <figure>
        <a href="assets/smart-basket/03-empty-basket.png" aria-label="Open full-size screenshot of empty basket">
          <img src="assets/smart-basket/03-empty-basket.png" width="1080" height="2400" loading="lazy" alt="The In basket tab shows a zero total in Botswana pula">
        </a>
        <figcaption>Empty basket</figcaption>
      </figure>
      <figure>
        <a href="assets/smart-basket/04-to-buy.png" aria-label="Open full-size screenshot of shopping list">
          <img src="assets/smart-basket/04-to-buy.png" width="1080" height="2400" loading="lazy" alt="Milk and bread on the To buy list with an estimated total of BWP 44.40">
        </a>
        <figcaption>Shopping list</figcaption>
      </figure>
      <figure>
        <a href="assets/smart-basket/05-in-basket.png" aria-label="Open full-size screenshot of basket total">
          <img src="assets/smart-basket/05-in-basket.png" width="1080" height="2400" loading="lazy" alt="Four apples in the basket with a total of BWP 13.00">
        </a>
        <figcaption>Basket total</figcaption>
      </figure>
      <figure>
        <a href="assets/smart-basket/06-add-item.png" aria-label="Open full-size screenshot of add an item">
          <img src="assets/smart-basket/06-add-item.png" width="1080" height="2400" loading="lazy" alt="Form for entering an item name, unit price, quantity and optional barcode">
        </a>
        <figcaption>Add an item</figcaption>
      </figure>
      <figure>
        <a href="assets/smart-basket/07-edit-item.png" aria-label="Open full-size screenshot of edit an item">
          <img src="assets/smart-basket/07-edit-item.png" width="1080" height="2400" loading="lazy" alt="Edit form showing two cartons of milk and their calculated total">
        </a>
        <figcaption>Edit an item</figcaption>
      </figure>
      <figure>
        <a href="assets/smart-basket/08-scanner-popup.png" aria-label="Open full-size screenshot of barcode scanner">
          <img src="assets/smart-basket/08-scanner-popup.png" width="1080" height="2400" loading="lazy" alt="Camera preview with a guide for positioning a product barcode">
        </a>
        <figcaption>Barcode scanner</figcaption>
      </figure>
      <figure>
        <a href="assets/smart-basket/09-currency-picker.png" aria-label="Open full-size screenshot of currency picker">
          <img src="assets/smart-basket/09-currency-picker.png" width="1080" height="2400" loading="lazy" alt="List of currencies with a search field for names and codes">
        </a>
        <figcaption>Currency picker</figcaption>
      </figure>
      <figure>
        <a href="assets/smart-basket/10-currency-search.png" aria-label="Open full-size screenshot of currency search">
          <img src="assets/smart-basket/10-currency-search.png" width="1080" height="2400" loading="lazy" alt="Searching for BWP returns the Botswana pula">
        </a>
        <figcaption>Currency search</figcaption>
      </figure>
      <figure>
        <a href="assets/smart-basket/11-validation.png" aria-label="Open full-size screenshot of form validation">
          <img src="assets/smart-basket/11-validation.png" width="1080" height="2400" loading="lazy" alt="The add-item form prompts the shopper to enter a missing item name">
        </a>
        <figcaption>Form validation</figcaption>
      </figure>
      <figure>
        <a href="assets/smart-basket/12-clear-confirmation.png" aria-label="Open full-size screenshot of clear basket confirmation">
          <img src="assets/smart-basket/12-clear-confirmation.png" width="1080" height="2400" loading="lazy" alt="A dialog asks the shopper to confirm clearing the basket">
        </a>
        <figcaption>Clear basket confirmation</figcaption>
      </figure>
    </div>
  </main>
  <dialog class="screenshot-viewer" aria-labelledby="viewer-title">
    <div class="viewer-header">
      <h2 id="viewer-title">Smart Basket screenshots</h2>
      <div class="viewer-actions">
        <button type="button" class="viewer-fullscreen" aria-label="Fullscreen" aria-pressed="false" title="Fullscreen">⛶</button>
        <form method="dialog"><button autofocus>Close</button></form>
      </div>
    </div>
    <figure>
      <div class="viewer-stage">
        <button type="button" data-step="-1" aria-label="Previous screenshot">‹</button>
        <img alt="">
        <button type="button" data-step="1" aria-label="Next screenshot">›</button>
      </div>
      <figcaption aria-live="polite"></figcaption>
    </figure>
  </dialog>
</body>
</html>
